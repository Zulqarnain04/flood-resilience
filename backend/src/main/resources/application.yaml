spring:
  application:
    name: siaga-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/siaga}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

logging:
  level:
    root: INFO
    com.flood_resilience.backend: INFO

app:
  cors:
    allowed-origins:
      - http://localhost:8081
      - http://localhost:3000
  dashboard:
    high-priority-threshold: 8

ollama:
  api-url: ${OLLAMA_API_URL:http://localhost:11434/api/chat}
  model: ${OLLAMA_MODEL:llama3.2:3b}
  timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}